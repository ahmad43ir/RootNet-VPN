name: Build VlessHub APK

on:
  push:
    branches: [master]
    paths:
      - 'vlesshub/vlesshub-app/**'
      - '.github/workflows/build-vlesshub.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build VlessHub debug APK
        working-directory: vlesshub/vlesshub-app
        run: ./gradlew :app:assembleDebug

      - name: Build VlessHub release APK
        working-directory: vlesshub/vlesshub-app
        run: ./gradlew :app:assembleRelease || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vlesshub-debug
          path: vlesshub/vlesshub-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vlesshub-release
          path: vlesshub/vlesshub-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
