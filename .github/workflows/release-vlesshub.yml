name: Release VlessHub

on:
  push:
    tags:
      - 'vlesshub-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. vlesshub-v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build VlessHub release APK
        working-directory: vlesshub/vlesshub-app
        run: ./gradlew :app:assembleRelease || true

      - name: Build VlessHub debug APK (fallback)
        if: failure()
        working-directory: vlesshub/vlesshub-app
        run: ./gradlew :app:assembleDebug

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "VlessHub ${{ steps.tag.outputs.version }}"
          body: |
            ## VlessHub ${{ steps.tag.outputs.version }}

            ### Download
            - **APK**: Download `VlessHub.apk` below
            - Install on Android 6.0+ (API 23+)

            ### What's New
            - See commit history for changes
          files: |
            vlesshub/vlesshub-app/app/build/outputs/apk/release/*.apk
            vlesshub/vlesshub-app/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
